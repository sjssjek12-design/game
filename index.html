<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>남극 탈출</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#12263a;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ================== 기본 설정 ==================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() {
  const d = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize); resize();

const FONT = 'system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
const WORLD = 2600;
const RESCUE_TIME = 60;   // 헬기 호출까지 버틸 시간
const LAND_TIME = 10;     // 헬기 하강 시간
const TOUCH = 'ontouchstart' in window;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function angLerp(a, b, t) {
  let d = ((b - a) % TAU + TAU * 1.5) % TAU - Math.PI;
  a += d * t;
  return Math.atan2(Math.sin(a), Math.cos(a));
}
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

let best = 0;
try { best = parseFloat(localStorage.getItem('antarctic_dino_best')) || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('antarctic_dino_best', String(best)); } catch (e) {} }

// ================== 사운드 ==================
let AC = null, muted = false;
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type = 'sine', vol = .15, slide = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, f0, f1) {
  if (!AC || muted) return;
  const t = AC.currentTime, n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = buf;
  const fl = AC.createBiquadFilter(); fl.type = 'lowpass';
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(fl).connect(g).connect(AC.destination); s.start(t);
}
const sfx = {
  roar() { noise(1.3, .55, 900, 100); tone(95, 1.2, 'sawtooth', .13, -55); },
  screech() { tone(1100, .22, 'square', .05, 700); },
  flare() { noise(.6, .35, 5000, 300); tone(500, .35, 'triangle', .1, 700); },
  pick() { tone(660, .08, 'square', .07); setTimeout(() => tone(990, .12, 'square', .07), 70); },
  thud() { noise(.5, .6, 350, 50); tone(70, .4, 'sine', .3, -30); },
  die() { tone(320, .9, 'sawtooth', .15, -270); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .3, 'triangle', .12), i * 130)); },
  heli() { for (let i = 0; i < 6; i++) setTimeout(() => noise(.12, .18, 500, 150), i * 110); },
};

// ================== 입력 ==================
const keys = {};
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  audioInit();
  if (e.code === 'KeyM') { muted = !muted; msg(muted ? '소리 끔' : '소리 켬'); return; }
  if (state === 'play') {
    if (e.code === 'Space') useFlare();
    if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused;
  } else if ((e.code === 'Space' || e.code === 'Enter') && canStart()) start();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
cv.addEventListener('mousedown', () => {
  audioInit();
  if (state === 'play' && paused) paused = false;
  else if (state !== 'play' && canStart()) start();
});

// 터치: 왼쪽 가상 조이스틱 + 오른쪽 버튼
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
let sprintTouch = null;
function btns() { return { flare: { x: W - 80, y: H - 110, r: 40 }, sprint: { x: W - 170, y: H - 62, r: 36 } }; }
cv.addEventListener('touchstart', e => {
  e.preventDefault(); audioInit();
  if (state !== 'play') { if (canStart()) start(); return; }
  if (paused) { paused = false; return; }
  const b = btns();
  for (const t of e.changedTouches) {
    if (Math.hypot(t.clientX - b.flare.x, t.clientY - b.flare.y) < b.flare.r + 8) { useFlare(); continue; }
    if (Math.hypot(t.clientX - b.sprint.x, t.clientY - b.sprint.y) < b.sprint.r + 8) { sprintTouch = t.identifier; continue; }
    if (joy.id === null) { joy.id = t.identifier; joy.ox = joy.x = t.clientX; joy.oy = joy.y = t.clientY; }
  }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.x = t.clientX; joy.y = t.clientY; }
}, { passive: false });
function touchEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) joy.id = null;
    if (t.identifier === sprintTouch) sprintTouch = null;
  }
}
cv.addEventListener('touchend', touchEnd); cv.addEventListener('touchcancel', touchEnd);

// ================== 월드 ==================
let rocks, ices, drifts, penguins;
function genWorld() {
  rocks = []; ices = []; drifts = [];
  const c = WORLD / 2;
  for (let i = 0; i < 28; i++) ices.push({ x: rand(150, WORLD - 150), y: rand(150, WORLD - 150), rx: rand(90, 240), ry: rand(60, 150), rot: rand(0, Math.PI) });
  for (let i = 0; i < 22; i++) drifts.push({ x: rand(150, WORLD - 150), y: rand(150, WORLD - 150), rx: rand(70, 160), ry: rand(45, 100), rot: rand(0, Math.PI) });
  let tries = 0;
  while (rocks.length < 48 && tries++ < 3000) {
    const r = rand(26, 72), x = rand(90, WORLD - 90), y = rand(90, WORLD - 90);
    if (Math.hypot(x - c, y - c) < 220) continue;
    if (rocks.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 80)) continue;
    const pts = [], n = 7 + (Math.random() * 4 | 0);
    for (let k = 0; k < n; k++) { const a = k / n * TAU, m = rand(.82, 1.1); pts.push([Math.cos(a) * r * m, Math.sin(a) * r * m]); }
    rocks.push({ x, y, r, pts });
  }
  penguins = [];
  for (let i = 0; i < 16; i++) {
    const g = { x: rand(200, WORLD - 200), y: rand(200, WORLD - 200), vx: 0, vy: 0, r: 9, ang: rand(0, TAU), walk: 0, wt: 0, wx: 0, wy: 0 };
    penguins.push(g);
  }
}
function inEll(e, x, y) {
  const dx = x - e.x, dy = y - e.y, c = Math.cos(-e.rot), s = Math.sin(-e.rot);
  const u = dx * c - dy * s, v = dx * s + dy * c;
  return u * u / (e.rx * e.rx) + v * v / (e.ry * e.ry) < 1;
}
// 0 = 눈, 1 = 빙판(미끄러움), 2 = 눈더미(느려짐)
function terrain(x, y) {
  for (const e of drifts) if (inEll(e, x, y)) return 2;
  for (const e of ices) if (inEll(e, x, y)) return 1;
  return 0;
}
function collideRocks(o) {
  let hit = false;
  for (const r of rocks) {
    const dx = o.x - r.x, dy = o.y - r.y, d = Math.hypot(dx, dy), m = r.r * .9 + o.r;
    if (d < m && d > 0) {
      const nx = dx / d, ny = dy / d;
      o.x = r.x + nx * m; o.y = r.y + ny * m;
      const vn = o.vx * nx + o.vy * ny;
      if (vn < 0) { o.vx -= vn * nx; o.vy -= vn * ny; }
      hit = true;
    }
  }
  if (o.x < o.r || o.x > WORLD - o.r) { o.x = clamp(o.x, o.r, WORLD - o.r); o.vx = 0; hit = true; }
  if (o.y < o.r || o.y > WORLD - o.r) { o.y = clamp(o.y, o.r, WORLD - o.r); o.vy = 0; hit = true; }
  return hit;
}
function freeSpot(x, y, pad) { return x > 80 && y > 80 && x < WORLD - 80 && y < WORLD - 80 && !rocks.some(r => Math.hypot(r.x - x, r.y - y) < r.r + pad); }

// ================== 게임 상태 ==================
let state = 'title', paused = false;
let P, dinos, pickups, prints, effects, msgs, T, spawnT, spawnCount, heli, shake, overT, caughtBy;
const cam = { x: WORLD / 2, y: WORLD / 2 };
const flakes = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), z: rand(.4, 1.4), s: rand(0, TAU) }));

function reset() {
  genWorld();
  P = { x: WORLD / 2, y: WORLD / 2, vx: 0, vy: 0, r: 13, ang: -Math.PI / 2, stam: 100, exhaust: false, flares: 2, walk: 0, step: 0, side: 1, boost: 0 };
  dinos = []; pickups = []; prints = []; effects = []; msgs = [];
  T = 0; spawnT = 3; spawnCount = 0; heli = null; shake = 0; overT = 0; caughtBy = null; paused = false;
  cam.x = P.x; cam.y = P.y;
  for (let i = 0; i < 12; i++) spawnPickup(false);
}
function start() { reset(); state = 'play'; msg('얼음 속 공룡들이 깨어났다! 도망쳐!'); }
function canStart() { return state === 'title' || overT > 1; }
function msg(text) { msgs.push({ text, t: 0 }); if (msgs.length > 3) msgs.shift(); }

function spawnPickup(near) {
  for (let i = 0; i < 40; i++) {
    let x, y;
    if (near) { const a = rand(0, TAU), d = rand(350, 900); x = P.x + Math.cos(a) * d; y = P.y + Math.sin(a) * d; }
    else { x = rand(200, WORLD - 200); y = rand(200, WORLD - 200); }
    if (!freeSpot(x, y, 30)) continue;
    pickups.push({ x, y, type: Math.random() < .45 ? 'flare' : 'cocoa', t: rand(0, TAU) });
    return;
  }
}
function spawnDino(type) {
  let x = 0, y = 0;
  for (let i = 0; i < 60; i++) {
    const a = rand(0, TAU), d = rand(650, 900);
    x = P.x + Math.cos(a) * d; y = P.y + Math.sin(a) * d;
    if (freeSpot(x, y, 45)) break;
  }
  x = clamp(x, 80, WORLD - 80); y = clamp(y, 80, WORLD - 80);
  const tr = type === 'trex';
  dinos.push({ type, x, y, vx: 0, vy: 0, r: tr ? 30 : 15, ang: Math.atan2(P.y - y, P.x - x), stun: 0, st: 'chase', stT: 0, cd: rand(1, 3), walk: 0, step: 0, side: 1, cx: 0, cy: 0 });
  if (tr) { sfx.roar(); shake = Math.max(shake, 12); msg('티라노사우루스가 나타났다!'); }
  else { sfx.screech(); msg('랩터 출현!'); }
}
function useFlare() {
  if (state !== 'play' || paused) return;
  if (P.flares <= 0) { msg('조명탄이 없다!'); return; }
  P.flares--; sfx.flare(); shake = Math.max(shake, 5);
  effects.push({ k: 'flash', x: P.x, y: P.y, t: 0, life: .6 });
  effects.push({ k: 'flare', x: P.x, y: P.y, t: 0, life: 5 });
  let n = 0;
  for (const d of dinos) {
    const dd = dist(d, P);
    if (dd < 300) {
      d.stun = Math.max(d.stun, 3.2); d.st = 'chase';
      const a = Math.atan2(d.y - P.y, d.x - P.x);
      d.vx = Math.cos(a) * 320; d.vy = Math.sin(a) * 320; n++;
    }
  }
  if (n) msg(`공룡 ${n}마리 기절!`);
}
function addPrint(o, type) {
  prints.push({ x: o.x + Math.cos(o.ang + Math.PI / 2) * o.side * o.r * .45, y: o.y + Math.sin(o.ang + Math.PI / 2) * o.side * o.r * .45, ang: o.ang, type, t: 0 });
  o.side *= -1;
  if (prints.length > 500) prints.shift();
}
function gameOver(d) {
  state = 'over'; caughtBy = d.type; overT = 0; shake = 22; sfx.die();
  if (T > best) { best = T; saveBest(); }
}
function win() {
  state = 'win'; overT = 0; sfx.win();
  if (T > best) { best = T; saveBest(); }
}

// ================== 업데이트 ==================
function update(dt) {
  for (const m of msgs) m.t += dt;
  while (msgs.length && msgs[0].t > 3) msgs.shift();
  for (const f of flakes) { f.y += dt * .05 * f.z; f.x += Math.sin(f.s += dt) * dt * .01; if (f.y > 1) { f.y = 0; f.x = Math.random(); } }
  shake = Math.max(0, shake - dt * 30);
  if (state !== 'play') overT += dt;
  if (state === 'play' && !paused) updateGame(dt);
  if (!paused) updatePenguins(dt);
  for (const e of effects) e.t += dt;
  effects = effects.filter(e => e.t < e.life);
  for (const p of prints) p.t += dt;
  while (prints.length && prints[0].t > 9) prints.shift();
}

function updateGame(dt) {
  T += dt;
  const diff = 1 + T / 400;

  // --- 플레이어 ---
  let ix = 0, iy = 0;
  if (keys.KeyA || keys.ArrowLeft) ix--;
  if (keys.KeyD || keys.ArrowRight) ix++;
  if (keys.KeyW || keys.ArrowUp) iy--;
  if (keys.KeyS || keys.ArrowDown) iy++;
  if (joy.id !== null) {
    const jx = joy.x - joy.ox, jy = joy.y - joy.oy, jl = Math.hypot(jx, jy);
    if (jl > 8) { ix = jx / Math.max(jl, 45); iy = jy / Math.max(jl, 45); }
  }
  const il = Math.hypot(ix, iy);
  if (il > 1) { ix /= il; iy /= il; }
  const moving = il > .1;
  const wantSprint = (keys.ShiftLeft || keys.ShiftRight || sprintTouch !== null) && moving;
  let sprint = false;
  if (P.boost > 0) { P.boost -= dt; sprint = moving; }
  else if (wantSprint && !P.exhaust && P.stam > 0) {
    sprint = true; P.stam -= 26 * dt;
    if (P.stam <= 0) { P.stam = 0; P.exhaust = true; msg('헉헉... 숨이 차다!'); }
  }
  if (!sprint || P.boost > 0) P.stam = Math.min(100, P.stam + 19 * dt);
  if (P.exhaust && P.stam >= 35) P.exhaust = false;

  const pt = terrain(P.x, P.y);
  let sp = sprint ? 340 : 215; if (P.exhaust) sp *= .85; if (pt === 2) sp *= .55;
  const k = pt === 1 ? 1.4 : 12;
  P.vx += (ix * sp - P.vx) * Math.min(1, k * dt);
  P.vy += (iy * sp - P.vy) * Math.min(1, k * dt);
  P.x += P.vx * dt; P.y += P.vy * dt;
  collideRocks(P);
  const pv = Math.hypot(P.vx, P.vy);
  if (moving) P.ang = angLerp(P.ang, Math.atan2(iy, ix), Math.min(1, 14 * dt));
  P.walk += pv * dt * .12;
  P.step += pv * dt; if (P.step > 22 && pt !== 1) { P.step = 0; addPrint(P, 'p'); }

  // --- 아이템 ---
  for (let i = pickups.length - 1; i >= 0; i--) {
    const it = pickups[i]; it.t += dt;
    if (dist(it, P) < P.r + 18) {
      pickups.splice(i, 1); sfx.pick();
      effects.push({ k: 'puff', x: it.x, y: it.y, t: 0, life: .5, c: it.type === 'flare' ? '#ff5a3c' : '#a0602e' });
      if (it.type === 'flare') { P.flares = Math.min(5, P.flares + 1); msg('조명탄 +1'); }
      else { P.stam = 100; P.exhaust = false; P.boost = 4; msg('따뜻한 코코아! 4초간 무한 질주'); }
    }
  }
  if (pickups.length < 12 && Math.random() < dt * .6) spawnPickup(true);

  // --- 공룡 등장 ---
  spawnT -= dt;
  if (spawnT <= 0 && dinos.length < 16) {
    spawnCount++;
    spawnDino(T > 18 && spawnCount % 4 === 0 ? 'trex' : 'raptor');
    spawnT = Math.max(3.5, 9 - T * .07);
  }

  // --- 공룡 AI ---
  for (const d of dinos) {
    const tr = d.type === 'trex';
    const terr = terrain(d.x, d.y);
    d.cd -= dt;
    if (d.stun > 0) {
      d.stun -= dt;
      const f = Math.pow(terr === 1 ? .6 : .03, dt);
      d.vx *= f; d.vy *= f;
      d.x += d.vx * dt; d.y += d.vy * dt; collideRocks(d);
      continue;
    }
    const dx = P.x - d.x, dy = P.y - d.y, dd = Math.hypot(dx, dy) || 1;
    let tx = dx / dd, ty = dy / dd, s, kk;
    if (tr) {
      if (d.st === 'chase') {
        s = 150 * diff; kk = 3;
        if (dd < 430 && d.cd <= 0) { d.st = 'wind'; d.stT = .8; sfx.roar(); shake = Math.max(shake, 8); }
      } else if (d.st === 'wind') {
        s = 0; kk = 6; d.stT -= dt; d.ang = angLerp(d.ang, Math.atan2(dy, dx), Math.min(1, 10 * dt));
        if (d.stT <= 0) { d.st = 'charge'; d.stT = 1.15; d.cx = Math.cos(d.ang); d.cy = Math.sin(d.ang); }
      } else {
        s = 440; kk = 5; tx = d.cx; ty = d.cy; d.stT -= dt;
        if (d.stT <= 0) { d.st = 'chase'; d.cd = rand(2.5, 4); }
      }
    } else {
      const lead = Math.min(dd / 320, .6);
      const lx = P.x + P.vx * lead - d.x, ly = P.y + P.vy * lead - d.y, ll = Math.hypot(lx, ly) || 1;
      tx = lx / ll; ty = ly / ll;
      s = 232 * diff; kk = 2.2;
      if (d.st === 'pounce') { s *= 1.75; d.stT -= dt; if (d.stT <= 0) d.st = 'chase'; }
      else if (dd < 150 && d.cd <= 0) { d.st = 'pounce'; d.stT = .35; d.cd = rand(2, 3.2); sfx.screech(); }
    }
    if (terr === 1) kk *= .22;   // 빙판에서는 공룡도 미끄러진다
    if (terr === 2) s *= .6;
    d.vx += (tx * s - d.vx) * Math.min(1, kk * dt);
    d.vy += (ty * s - d.vy) * Math.min(1, kk * dt);
    for (const o of dinos) if (o !== d) {
      const sx = d.x - o.x, sy = d.y - o.y, sd = Math.hypot(sx, sy), m = d.r + o.r;
      if (sd < m && sd > 0) { const push = (m - sd) / 2; d.x += sx / sd * push; d.y += sy / sd * push; }
    }
    d.x += d.vx * dt; d.y += d.vy * dt;
    const hit = collideRocks(d);
    if (hit && tr && d.st === 'charge') {
      d.st = 'chase'; d.stun = 2.5; d.cd = 3; d.vx *= -.3; d.vy *= -.3;
      sfx.thud(); shake = Math.max(shake, 16);
      effects.push({ k: 'puff', x: d.x + d.cx * 30, y: d.y + d.cy * 30, t: 0, life: .6, c: '#8a929c' });
      msg('쾅! 티라노가 바위에 박치기했다!');
    }
    const dv = Math.hypot(d.vx, d.vy);
    if (dv > 25 && d.st !== 'wind') d.ang = angLerp(d.ang, Math.atan2(d.vy, d.vx), Math.min(1, (tr ? 5 : 9) * dt));
    d.walk += dv * dt * (tr ? .05 : .09);
    d.step += dv * dt; if (d.step > (tr ? 48 : 30) && terr !== 1) { d.step = 0; addPrint(d, tr ? 't' : 'r'); }
    if (dist(d, P) < d.r + P.r - 4) { gameOver(d); return; }
  }

  // --- 구조 헬기 ---
  if (!heli && T >= RESCUE_TIME) {
    let x = 0, y = 0;
    for (let i = 0; i < 80; i++) {
      const a = rand(0, TAU), dd = rand(800, 1100);
      x = clamp(P.x + Math.cos(a) * dd, 200, WORLD - 200); y = clamp(P.y + Math.sin(a) * dd, 200, WORLD - 200);
      if (Math.hypot(x - P.x, y - P.y) > 600) break;
    }
    rocks = rocks.filter(r => Math.hypot(r.x - x, r.y - y) > r.r + 90);

function updatePenguins(dt) {
  for (const g of penguins) {
    let fx = 0, fy = 0, scared = false;
    const threats = state === 'play' ? [P, ...dinos] : [];
    for (const t of threats) {
      const dx = g.x - t.x, dy = g.y - t.y, d = Math.hypot(dx, dy);
      if (d < 160 && d > 0) { fx += dx / d; fy += dy / d; scared = true; }
    }
    let tx = 0, ty = 0, s = 0;
    if (scared) { const l = Math.hypot(fx, fy) || 1; tx = fx / l; ty = fy / l; s = 130; }
    else {

      if (g.wt <= 0) { g.wt = rand(1.5, 4); const a = rand(0, TAU); g.wx = Math.random() < .4 ? 0 : Math.cos(a); g.wy = Math.random() < .4 ? 0 : Math.sin(a); }
      tx = g.wx; ty = g.wy; s = 28;

    const k = terrain(g.x, g.y) === 1 ? 1.5 : 6;
    g.vx += (tx * s - g.vx) * Math.min(1, k * dt); g.vy += (ty * s - g.vy) * Math.min(1, k * dt);
    g.x += g.vx * dt; g.y += g.vy * dt; collideRocks(g);
    const v = Math.hypot(g.vx, g.vy);

function drawIndicators() {
  for (const d of dinos) if (dist(d, P) < 1000) edgeArrow(d.x, d.y, d.type === 'trex' ? '#b8261b' : '#e0503a');
  if (heli) edgeArrow(heli.x, heli.y, '#20b860', `헬기 ${Math.round(dist(heli, P) / 10)}m`);
}
function panel(x, y, w, h) { ctx.fillStyle = 'rgba(10,25,45,.6)'; rrect(x, y, w, h, 10); ctx.fill(); }
function drawHUD() {
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  panel(12, 12, 220, 92);
  ctx.fillStyle = '#fff'; ctx.font = `800 22px ${FONT}`;
  ctx.fillText(`⏱ ${T.toFixed(1)}초`, 24, 34);
  ctx.font = `600 13px ${FONT}`; ctx.fillStyle = '#bcd3e6';
  ctx.fillText(`최고 기록 ${best.toFixed(1)}초`, 130, 35);
  ctx.fillStyle = '#fff'; ctx.font = `700 14px ${FONT}`;
  ctx.fillText('체력', 24, 62);
  ctx.fillStyle = 'rgba(255,255,255,.15)'; rrect(62, 55, 156, 14, 7); ctx.fill();
  ctx.fillStyle = P.boost > 0 ? '#ffc94a' : P.exhaust ? '#e05a4a' : '#4ad08a';
  rrect(62, 55, Math.max(0, 156 * P.stam / 100), 14, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText('조명탄', 24, 88);
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i < P.flares ? '#ff5a3c' : 'rgba(255,255,255,.15)';
    rrect(80 + i * 18, 81, 12, 14, 3); ctx.fill();
  }
  const tw = 170; panel(W - tw - 12, 12, tw, 64);
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = `800 18px ${FONT}`;
  ctx.fillText(`🦖 ${dinos.length}마리`, W - 24, 32);
  ctx.font = `700 14px ${FONT}`;
  if (!heli) { ctx.fillStyle = '#9fe0ff'; ctx.fillText(`구조 헬기까지 ${Math.ceil(RESCUE_TIME - T)}초`, W - 24, 58); }
  else if (!heli.landed) { ctx.fillStyle = '#7dff9e'; ctx.fillText(`헬기 착륙 중… ${Math.ceil(LAND_TIME - heli.t)}초`, W - 24, 58); }
  else { ctx.fillStyle = '#7dff9e'; ctx.fillText('헬기에 탑승하라!', W - 24, 58); }
}
function drawTouch() {
  const b = btns();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,90,60,.55)'; circ(b.flare.x, b.flare.y, b.flare.r);
  ctx.fillStyle = '#fff'; ctx.font = `800 14px ${FONT}`; ctx.fillText(`조명탄 ${P.flares}`, b.flare.x, b.flare.y);
  ctx.fillStyle = sprintTouch !== null ? 'rgba(80,210,140,.8)' : 'rgba(80,210,140,.45)'; circ(b.sprint.x, b.sprint.y, b.sprint.r);
  ctx.fillStyle = '#fff'; ctx.fillText('달리기', b.sprint.x, b.sprint.y);
  if (joy.id !== null) {
    ctx.fillStyle = 'rgba(255,255,255,.2)'; circ(joy.ox, joy.oy, 50);
    const jx = joy.x - joy.ox, jy = joy.y - joy.oy, jl = Math.hypot(jx, jy), m = Math.min(1, 45 / (jl || 1));
    ctx.fillStyle = 'rgba(255,255,255,.55)'; circ(joy.ox + jx * m, joy.oy + jy * m, 22);
  }
}
function drawMsgs() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `800 20px ${FONT}`;
  msgs.forEach((m, i) => {
    const a = Math.min(1, m.t * 6, (3 - m.t) * 2), y = 128 + i * 34 - Math.min(m.t * 40, 6);
    ctx.globalAlpha = Math.max(0, a);
    const w = ctx.measureText(m.text).width + 30;
    ctx.fillStyle = 'rgba(10,25,45,.7)'; rrect(W / 2 - w / 2, y - 15, w, 30, 15); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(m.text, W / 2, y);
  });
  ctx.globalAlpha = 1;
}
function overlay(a) { ctx.fillStyle = `rgba(8,20,36,${a})`; ctx.fillRect(0, 0, W, H); }
function drawTitle() {
  overlay(.55);
  const cx = W / 2, sm = W < 600;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 ${sm ? 44 : 68}px ${FONT}`;
  ctx.fillStyle = '#0a1a2c'; ctx.fillText('남극 탈출', cx + 4, H * .2 + 4);
  ctx.fillStyle = '#eaf6ff'; ctx.fillText('남극 탈출', cx, H * .2);
  ctx.font = `700 ${sm ? 15 : 20}px ${FONT}`; ctx.fillStyle = '#ffb36b';
  ctx.fillText('빙하 속에 잠들어 있던 공룡들이 깨어났다!', cx, H * .2 + (sm ? 44 : 60));
  const lines = TOUCH ? [
    '왼쪽 화면 드래그 — 이동',
    '달리기 버튼 — 전력 질주 (체력 소모)',
    '조명탄 버튼 — 주변 공룡 기절',
  ] : [
    'WASD / 방향키 — 이동',
    'Shift — 전력 질주 (체력 소모)',
    'Space — 조명탄 (주변 공룡 기절)',
    'P — 일시정지   M — 소리',
  ];
  const tips = [
    `${RESCUE_TIME}초 버티면 구조 헬기가 온다. 착륙 지점까지 달려라!`,
    '빙판 위에선 공룡도 미끄러진다',
    '티라노가 "!" 하면 돌진한다 — 바위 뒤로 유인하면 박치기!',
    '코코아 ☕ = 체력 회복 + 무한 질주',
  ];
  ctx.font = `600 ${sm ? 14 : 17}px ${FONT}`; ctx.fillStyle = '#ffffff';
  lines.forEach((l, i) => ctx.fillText(l, cx, H * .42 + i * (sm ? 24 : 28)));
  ctx.font = `500 ${sm ? 12 : 15}px ${FONT}`; ctx.fillStyle = '#9fc6e2';
  const ty = H * .42 + lines.length * (sm ? 24 : 28) + 20;
  tips.forEach((l, i) => ctx.fillText('· ' + l, cx, ty + i * (sm ? 20 : 24)));
  const blink = .6 + .4 * Math.sin(performance.now() / 250);
  ctx.globalAlpha = blink; ctx.font = `800 ${sm ? 18 : 24}px ${FONT}`; ctx.fillStyle = '#7dff9e';
  ctx.fillText(TOUCH ? '화면을 터치해서 시작' : '스페이스 / 클릭으로 시작', cx, H * .88);
  ctx.globalAlpha = 1;
  if (best > 0) { ctx.font = `600 14px ${FONT}`; ctx.fillStyle = '#bcd3e6'; ctx.fillText(`최고 기록 ${best.toFixed(1)}초`, cx, H * .88 + 32); }
}
function drawEnd(won) {
  overlay(Math.min(.65, overT));
  const cx = W / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 ${W < 600 ? 46 : 64}px ${FONT}`;
  ctx.fillStyle = won ? '#7dff9e' : '#ff5a4a';
  ctx.fillText(won ? '탈출 성공!' : '잡혔다!', cx, H * .32);
  ctx.font = `700 20px ${FONT}`; ctx.fillStyle = '#fff';
  ctx.fillText(won ? '구조 헬기를 타고 남극을 빠져나왔다 🚁' : (caughtBy === 'trex' ? '티라노사우루스의 한 끼 식사가 되었다…' : '랩터 무리에게 따라잡혔다…'), cx, H * .32 + 56);
  ctx.font = `600 18px ${FONT}`; ctx.fillStyle = '#bcd3e6';
  ctx.fillText(`생존 시간 ${T.toFixed(1)}초   ·   최고 기록 ${best.toFixed(1)}초`, cx, H * .32 + 96);
  ctx.fillText(`쫓아온 공룡 ${dinos.length}마리`, cx, H * .32 + 126);
  if (overT > 1) {
    ctx.globalAlpha = .6 + .4 * Math.sin(performance.now() / 250);
    ctx.font = `800 22px ${FONT}`; ctx.fillStyle = '#fff';
    ctx.fillText(TOUCH ? '터치해서 다시 하기' : '스페이스 / 클릭으로 다시 하기', cx, H * .72);
    ctx.globalAlpha = 1;
  }
}
function drawPause() {
  overlay(.5);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 48px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('일시정지', W / 2, H / 2 - 20);
  ctx.font = `600 18px ${FONT}`; ctx.fillStyle = '#bcd3e6'; ctx.fillText(TOUCH ? '터치해서 계속' : 'P 또는 클릭으로 계속', W / 2, H / 2 + 30);
}

// ================== 루프 ==================
reset();
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
